name: Release content snapshot

on:
  schedule:
    - cron: "0 03 * * 0"
  workflow_dispatch:
    inputs:
      baseline-snapshot:
        description: Optional exact content release for offline curation
        required: false
        type: string
      baseline-receipt-sha256:
        description: Required receipt digest when using offline curation
        required: false
        type: string
      enrichment-release:
        description: Exact release containing validated enrichment-decisions.json
        required: false
        type: string
      enrichment-sha256:
        description: SHA-256 of the validated enrichment decision artifact
        required: false
        type: string

permissions: {}

concurrency:
  group: content-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: Build and publish snapshot
    environment: repository-settings
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write # download the prior manifest and publish changed releases
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - name: Download previous manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASELINE_SNAPSHOT: ${{ inputs.baseline-snapshot }}
          BASELINE_RECEIPT: ${{ inputs.baseline-receipt-sha256 }}
        run: |
          set -euo pipefail
          mkdir -p previous
          if [[ -n "$BASELINE_SNAPSHOT" ]]; then
            [[ "$BASELINE_SNAPSHOT" =~ ^content-[0-9]{8}T[0-9]{6}Z$ ]]
            [[ "$BASELINE_RECEIPT" =~ ^[0-9a-f]{64}$ ]]
            gh release download "$BASELINE_SNAPSHOT" --dir previous
            test "$(sha256sum previous/publication.json | cut -d ' ' -f 1)" = "$BASELINE_RECEIPT"
            uv run html-to-markdown verify-publication --output previous --release-tag "$BASELINE_SNAPSHOT"
            tar -xzf previous/html-to-markdown-content.tar.gz -C previous
            exit 0
          fi
          test -z "$BASELINE_RECEIPT"

          previous_tag="$(
            gh api --method GET --paginate \
              "repos/$REPOSITORY/releases" -f per_page=100 \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
              grep -E '^content-[0-9]{8}T[0-9]{6}Z$' |
              head -n 1
          )"
          if test -n "$previous_tag"; then
            gh release download "$previous_tag" --pattern manifest.json \
              --pattern html-to-markdown-content.tar.gz --dir previous
            tar -xzf previous/html-to-markdown-content.tar.gz -C previous
          fi
      - name: Build artifact-first snapshot
        env:
          PREVIOUS_MANIFEST_HASH: ${{ hashFiles('previous/manifest.json') }}
          BASELINE_SNAPSHOT: ${{ inputs.baseline-snapshot }}
        run: |
          set -euo pipefail
          if [[ -n "$BASELINE_SNAPSHOT" ]]; then
            mkdir -p build
            cp -a previous/content build/
            cp previous/manifest.json build/
            uv run html-to-markdown curate-content --output build
            exit 0
          fi
          args=(run --source all --output build \
            --benchmark benchmarks/full-prototype-inventory.json)
          if [[ -n "$PREVIOUS_MANIFEST_HASH" ]]; then
            args+=(--previous-manifest previous/manifest.json)
            args+=(--quality-reference previous)
          fi
          uv run html-to-markdown "${args[@]}"
      - name: Replay independently validated enrichment
        if: inputs.enrichment-release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ENRICHMENT_RELEASE: ${{ inputs.enrichment-release }}
          ENRICHMENT_SHA256: ${{ inputs.enrichment-sha256 }}
          BASELINE_SNAPSHOT: ${{ inputs.baseline-snapshot }}
        run: |
          set -euo pipefail
          test -n "$BASELINE_SNAPSHOT"
          [[ "$ENRICHMENT_RELEASE" =~ ^enrichment-[0-9]{8}T[0-9]{6}Z$ ]]
          [[ "$ENRICHMENT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p enrichment-input
          gh release download "$ENRICHMENT_RELEASE" --pattern enrichment-decisions.json --dir enrichment-input
          uv run html-to-markdown enrich-content --output build --mode replay \
            --decisions enrichment-input/enrichment-decisions.json \
            --decisions-sha256 "$ENRICHMENT_SHA256"
          uv run html-to-markdown verify-enrichment --output build
      - name: Upload enrichment evidence separately
        if: inputs.enrichment-release != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: enrichment-evidence-${{ github.run_id }}
          if-no-files-found: error
          path: |
            build/enrichment-state.json
            build/.enrichment/report.json
            build/.enrichment/report.md
      - name: Detect normalized content change
        id: changed
        run: |
          if test -f previous/manifest.json &&
             diff -q \
               <(jq -S '{documents: [.documents[] | {url,path,body_sha256,file_sha256,size_bytes}],assets,removals}' previous/manifest.json) \
               <(jq -S '{documents: [.documents[] | {url,path,body_sha256,file_sha256,size_bytes}],assets,removals}' build/manifest.json); then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify archive checksum
        working-directory: build
        run: sha256sum --check html-to-markdown-content.tar.gz.sha256
      - name: Build immutable publication receipt
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          tag="content-$(date -u +%Y%m%dT%H%M%SZ)"
          created_at="$(jq -r .ended_at build/manifest.json)"
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          uv run html-to-markdown publication --output build \
            --release-tag "$tag" --source-commit "$SOURCE_COMMIT" \
            --created-at "$created_at" --published-at "$published_at"
          echo "release_tag=$tag" >> "$GITHUB_ENV"
          echo "receipt_sha256=$(sha256sum build/publication.json | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Upload completed-run artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: html-to-markdown-content-${{ github.run_id }}
          if-no-files-found: error
          path: |
            build/html-to-markdown-content.tar.gz
            build/html-to-markdown-content.tar.gz.sha256
            build/manifest.json
            build/quality-report.json
            build/quality-report.md
            build/publication.json
      - name: Upload curation evidence separately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: curation-audit-${{ github.run_id }}
          if-no-files-found: error
          path: build/curation-audit.json
      - name: Publish changed snapshot
        if: steps.changed.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
        run: |
          release_created=false
          cleanup_draft() {
            if [[ "$release_created" == true ]]; then
              gh release delete "$release_tag" --cleanup-tag --yes || true
            fi
          }
          trap cleanup_draft EXIT
          gh release create "$release_tag" --draft --latest=false --title "$release_tag" --generate-notes \
            build/html-to-markdown-content.tar.gz \
            build/html-to-markdown-content.tar.gz.sha256 \
            build/manifest.json \
            build/quality-report.json \
            build/quality-report.md \
            build/publication.json
          release_created=true
          mkdir verify-release
          gh release download "$release_tag" --dir verify-release
          uv run html-to-markdown verify-publication \
            --output verify-release --release-tag "$release_tag"
          gh release edit "$release_tag" --draft=false
          release_created=false
      - name: Dispatch immutable snapshot to Pages
        if: steps.changed.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh workflow run github-pages-deploy.yml --ref main --repo "$REPOSITORY" \
            -f "snapshot-tag=$release_tag" \
            -f "publication-sha256=$receipt_sha256"
